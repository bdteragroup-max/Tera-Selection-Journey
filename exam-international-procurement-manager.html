        #langToggle:hover,
        #backBtn:hover {
            background: rgba(255, 255, 255, 0.28);

    </style>

                modalBtn: "ตกลง",

            en: {

                pageTitle: "Assessment: International Procurement Manager",
                userInfo: (name, pos) => `Applicant: ${name} | Position: ${pos}`,
                progress: (cur, total) => `Question ${cur} of ${total}`,
                saving: "Submitting your responses...",

                modalTitle: "Thank you for your responses!",
                modalDesc: "We wish you the best of luck in your interview.",
                modalBtn: "Done",
            }
        };

        const questions = [
            // หมวดที่ 1: กลยุทธ์การสรรหาซัพพลายเออร์โลกและการควบคุมต้นทุน (Global Sourcing Strategy & Total Cost of Ownership)
            {
                category: "หมวดที่ 1: กลยุทธ์การสรรหาซัพพลายเออร์โลกและการควบคุมต้นทุน",
                categoryEn: "Category 1: Global Sourcing & Total Cost of Ownership",
                q: "1. บริษัทของคุณมีแผนจะสั่งซื้อเครื่องจักรหลักมูลค่า 50 ล้านบาทจากซัพพลายเออร์ในยุโรป โดยมีระยะเวลาผลิตและส่งมอบนาน 9 เดือน ในฐานะหัวหน้าฝ่ายจัดซื้อต่างประเทศ คุณควรวางกลยุทธ์จัดการความเสี่ยงด้านอัตราแลกเปลี่ยน (FX Risk Management) ร่วมกับฝ่ายการเงินอย่างไรเพื่อป้องกันต้นทุนบานปลาย?",
                qEn: "1. Procuring a 50M THB mission-critical machine from Europe with a 9-month lead time, how should you partner with Treasury to hedge FX volatility risk and prevent cost escalation?",
                options: [
                    "ก. รอจนกว่าเครื่องจักรจะผลิตเสร็จแล้วค่อยไปลุ้นอัตราแลกเปลี่ยนที่ธนาคารในวันโอนเงิน",
                    "ข. แนะนำให้ทำสัญญาซื้อขายเงินตราต่างประเทศล่วงหน้า (Forward Contract) หรือสัญญาสิทธิที่จะซื้อเงินตราต่างประเทศ (FX Options) เพื่อล็อกอัตราแลกเปลี่ยน ณ วันที่เซ็นสัญญา รับประกันว่าต้นทุนสินค้าจะไม่ขยับขึ้นตามความผันผวนของตลาด",
                    "ค. ขอยกเลิกออร์เดอร์หากค่าเงินบาทอ่อนค่าลงแม้เพียง 1% โดยไม่สนใจค่าปรับ",
                    "ง. บังคับให้ซัพพลายเออร์ฝั่งยุโรปยอมรับการจ่ายเงินเป็นสกุลเงินบาทไทยในทุกกรณีโดยไม่มีข้อต่อรอง"
                ],
                optionsEn: [
                    "A. Wait passively until delivery and convert spot currency on the wire transfer date.",
                    "B. Execute a Forward Contract or FX Option collar to lock exchange rates on contract signing, eliminating margin erosion from foreign exchange volatility.",
                    "C. Cancel the order unilaterally if THB depreciates by even 1% regardless of contract penalties.",
                    "D. Demand the European vendor accept THB invoice denomination unconditionally."
                ],
                ans: 1
            },
            {
                category: "หมวดที่ 1: กลยุทธ์การสรรหาซัพพลายเออร์โลกและการควบคุมต้นทุน",
                categoryEn: "Category 1: Global Sourcing & Total Cost of Ownership",
                q: "2. ในการคำนวณ \"ต้นทุนรวมในการจัดหาผลิตภัณฑ์\" จากต่างประเทศ (Total Cost of Ownership: TCO) ข้อใดคือกลุ่มดัชนีต้นทุนที่ผู้จัดการจัดซื้อต้องนำมาคำนวณให้ครบถ้วนเพื่อไม่ให้เกิดค่าใช้จ่ายแฝง (Hidden Costs)?",
                qEn: "2. When computing Total Cost of Ownership (TCO) for cross-border procurement, which comprehensive cost cluster must be synthesized to avoid hidden cost overruns?",
                options: [
                    "ก. คำนวณเฉพาะราคาหน้าโรงงาน (EXW Price) และค่าระวางเรือเท่านั้น ส่วนค่าใช้จ่ายอื่นให้ฝ่ายบัญชีไปตามล้างตามเช็ดภายหลัง",
                    "ข. คำนวณราคาประเมินสินค้า, ค่าระวาง (Freight), ประกันภัย (Insurance), ภาษีนำเข้า (Customs Duty), ค่าธรรมเนียมพิธีการ (Clearance Fees), ต้นทุนการถือครองสต็อก (Holding Cost), รวมถึงต้นทุนความเสี่ยงด้านคุณภาพและการส่งมอบล่าช้า",
                    "ค. นับเฉพาะค่าตั๋วเครื่องบินและค่าโรงแรมที่ใช้เดินทางไปตรวจโรงงานซัพพลายเออร์",
                    "ง. การสุ่มเดาตัวเลขกลมๆ แล้วบวกเพิ่มไปอีก 5% จากราคาที่ซัพพลายเออร์เสนอมา"
                ],
                optionsEn: [
                    "A. Factor only EXW unit price and ocean freight, leaving all other charges for accounting to absorb later.",
                    "B. Calculate landed cost: baseline purchase price, freight, marine insurance, customs duty, port clearance, inventory carrying costs, along with quality failure and delay risk premiums.",
                    "C. Tabulate only flight tickets and hotel accommodations incurred during supplier factory visits.",
                    "D. Add an arbitrary 5% buffer on top of the supplier's initial quotation."
                ],
                ans: 1
            },
            {
                category: "หมวดที่ 1: กลยุทธ์การสรรหาซัพพลายเออร์โลกและการควบคุมต้นทุน",
                categoryEn: "Category 1: Global Sourcing & Total Cost of Ownership",
                q: "3. แหล่งวัตถุดิบหลักในประเทศจีนที่คุณพึ่งพาอยู่เพียงรายเดียว (Sole Sourcing) กำลังเผชิญปัญหามาตรการควบคุมสิ่งแวดล้อมจากรัฐบาลจีน ทำให้กำลังการผลิตลดลงและส่งมอบช้า ในฐานะผู้นำคุณควรปรับกลยุทธ์โครงสร้างห่วงโซ่อุปทาน (Supply Chain Resiliency) อย่างไร?",
                qEn: "3. A sole-source Chinese raw material supplier faces environmental curtailments, restricting output and delaying shipments. How do you reinforce supply chain resilience?",
                options: [
                    "ก. ส่งพนักงานจัดซื้อบินไปนั่งประท้วงที่หน้าโรงงานในจีนเพื่อกดดันให้เขาเร่งผลิต",
                    "ข. กระจายความเสี่ยงโดยเปลี่ยนมาใช้กลยุทธ์ \"China + 1\" หรือระบบ \"Multi-Sourcing\" เร่งสรรหาและพัฒนาซัพพลายเออร์สำรองในภูมิภาคอื่น เช่น อาเซียน หรืออินเดีย และทำสัญญาจับคู่ธุรกิจในระยะยาวเพื่อสร้างความมั่นคงเชิงวัตถุดิบ",
                    "ค. สั่งปิดไลน์การผลิตในไทยชั่วคราวและนั่งรอจนกว่าซัพพลายเออร์จีนจะกลับมาผลิตได้ตามปกติ",
                    "ง. พิมพ์อีเมลไปข่มขู่ซัพพลายเออร์ว่าจะฟ้องร้องต่อศาลโลกหากส่งสินค้าล่าช้ากว่ากำหนด"
                ],
                optionsEn: [
                    "A. Fly procurement buyers to stage a sit-in protest at the supplier's factory gates.",
                    "B. Execute a 'China + 1' / Multi-Sourcing strategy: rapidly qualify and develop alternate secondary vendors across ASEAN or India, securing raw material flow via long-term framework partnerships.",
                    "C. Halt domestic manufacturing lines and passively await Chinese regulatory normalization.",
                    "D. Threaten international court lawsuits via email for schedule slippage."
                ],
                ans: 1
            },
            {
                category: "หมวดที่ 1: กลยุทธ์การสรรหาซัพพลายเออร์โลกและการควบคุมต้นทุน",
                categoryEn: "Category 1: Global Sourcing & Total Cost of Ownership",
                q: "4. การประเมินความเสี่ยงและจริยธรรมของคู่ค้าในระดับสากล (Global Supplier Code of Conduct) ก่อนทำการขึ้นทะเบียน (Vendor Qualification) ข้อใดเป็นประเด็นวิกฤตที่จัดซื้อต่างประเทศต้องตรวจสอบอย่างเข้มงวดที่สุดตามมาตรฐาน ESG?",
                qEn: "4. When qualifying international vendors under modern ESG criteria, which ethical and regulatory compliance pillar must be audited most stringently?",
                options: [
                    "ก. การตรวจสอบว่าโลโก้ของซัพพลายเออร์ใช้สีที่เป็นมงคลตามหลักฮวงจุ้ยหรือไม่",
                    "ข. การตรวจสอบมาตรฐานแรงงาน (ไม่ใช้แรงงานทาสหรือแรงงานเด็ก), กระบวนการบำบัดมลพิษของโรงงาน, ความโปร่งใสทางการเงิน และมาตรการต่อต้านการทุจริตคอร์รัปชัน (Anti-Bribery)",
                    "ค. การเช็กว่าผู้บริหารของซัพพลายเออร์ชอบตีกอล์ฟเหมือนกับ CEO ของเราหรือไม่",
                    "ง. การดูว่าซัพพลายเออร์มีของที่ระลึกแจกให้ทีมจัดซื้อในวันปีใหม่มากน้อยเพียงใด"
                ],
                optionsEn: [
                    "A. Verifying if the vendor logo follows auspicious feng shui color harmonies.",
                    "B. Verifying labor standards (prohibition of forced/child labor), effluent/waste environmental treatment, audited financial disclosures, and robust anti-bribery governance.",
                    "C. Checking whether vendor directors share golf hobbies with our CEO.",
                    "D. Inspecting the quantity and extravagance of seasonal holiday gifts offered to buyers."
                ],
                ans: 1
            },
            {
                category: "หมวดที่ 1: กลยุทธ์การสรรหาซัพพลายเออร์โลกและการควบคุมต้นทุน",
                categoryEn: "Category 1: Global Sourcing & Total Cost of Ownership",
                q: "5. ซัพพลายเออร์เสนอขายสินค้าลดราคาพิเศษ 30% แต่มีเงื่อนไขว่าต้องสั่งซื้อในปริมาณขั้นต่ำ (MOQ) ที่สูงมาก ซึ่งจะทำให้บริษัทมีสต็อกวัตถุดิบนี้ใช้งานได้ยาวนานถึง 2 ปี ในฐานะหัวหน้าจัดซื้อ คุณจะวิเคราะห์ความคุ้มค่าอย่างไร?",
                qEn: "5. A supplier offers a 30% discount tied to a huge MOQ representing 2 years of raw material inventory. How should the procurement manager evaluate this trade-off?",
                options: [
                    "ก. รีบกดสั่งซื้อทันทีเพราะส่วนลด 30% หาไม่ได้ง่ายๆ และจะช่วยให้ตัวเลขจัดซื้อดูดีในระยะสั้น",
                    "ข. วิเคราะห์เปรียบเทียบระหว่าง \"เงินที่ประหยัดได้จากส่วนลด\" กับ \"ต้นทุนจมของกระแสเงินสด (Cash Tied Up), ค่าพื้นที่คลังสินค้า, ค่าประกันภัย, และความเสี่ยงที่วัตถุดิบจะเสื่อมสภาพหรือล้าสมัย (Obsolescence Risk) ก่อนจะใช้หมด\"",
                    "ค. สั่งซื้อมาเก็บไว้ก่อน แล้วค่อยแอบนำไปขายต่อในตลาดมืดเพื่อเอาเงินเข้ากระเป๋าตัวเอง",
                    "ง. ปฏิเสธข้อเสนอทันทีโดยไม่ทำการคำนวณใดๆ เพราะไม่ชอบทำงานกับซัพพลายเออร์ที่ตั้งเงื่อนไขเยอะ"
                ],
                optionsEn: [
                    "A. Order immediately to showcase short-term purchasing price variances.",
                    "B. Model discount savings against trapped working capital liquidity, warehousing storage, insurance fees, and the high risk of material degradation or engineering obsolescence over 24 months.",
                    "C. Procure the lot and secretly arbitrage excess stock into secondary markets for personal gain.",
                    "D. Reject the offer arbitrarily without quantitative review due to irritation with MOQ stipulations."
                ],
                ans: 1
            },

            // หมวดที่ 2: กฎหมายศุลกากร เทอมการค้าระหว่างประเทศ และสิทธิประโยชน์ภาษี (Incoterms 2020, Customs & Free Trade Agreements)
            {
                category: "หมวดที่ 2: กฎหมายศุลกากร เทอมการค้าระหว่างประเทศ และสิทธิประโยชน์ภาษี",
                categoryEn: "Category 2: Incoterms, Customs & Trade Agreements",
                q: "6. หากคุณตกลงซื้อขายสินค้าภายใต้เงื่อนไข Incoterms 2020 เทอม FOB (Free On Board) ณ ท่าเรือต้นทาง ประเทศญี่ปุ่น ความรับผิดชอบใน \"ค่าใช้จ่ายและ ความเสี่ยง\" ของฝั่งคุณในฐานะผู้ซื้อจะเริ่มต้นขึ้นอย่างสมบูรณ์เมื่อใด?",
                qEn: "6. Under Incoterms 2020 FOB (Free On Board, Port of Origin, Japan), precisely when do cost obligations and cargo loss risks transfer fully to you as the buyer?",
                options: [

            const payload = {
                targetTab: "International_Procurement_Manager",
                uuid: uuid,
                name: userName,
                position: "หัวหน้าฝ่ายจัดซื้อต่างประเทศ",
                answersCount: questions.length,
                userAgent: navigator.userAgent
            };

            userAnswers.forEach((ans, i) => {
                if (ans.isCorrect) score++;
                payload[`q${i + 1}_title`] = questions[i].q;
                payload[`q${i + 1}_category`] = questions[i].category;
                payload[`q${i + 1}_text`] = ans.text;
                payload[`q${i + 1}_score`] = ans.isCorrect ? "1" : "0";
            });

            payload.totalScore = String(score);
            payload.hrStatus = score >= 16 ? "ผ่านเกณฑ์โดดเด่น (เรียกสัมภาษณ์)" : (score >= 12 ? "ผ่านเกณฑ์มาตรฐาน (พิจารณาเพิ่มเติม)" : "ไม่ผ่านเกณฑ์");
            payload.decisionNote = score >= 16 ? "เรียกสัมภาษณ์ มีทักษะกลยุทธ์การจัดซื้อต่างประเทศ Incoterms กฎหมายศุลกากร และการเจรจาระดับสากลยอดเยี่ยม" : (score >= 12 ? "พิจารณาประวัติการทำงานและการสัมภาษณ์เพิ่มเติม" : "ไม่แนะนำ");

            document.getElementById('modalTitle').textContent = t.modalTitle;
            document.getElementById('modalDesc').textContent = t.modalDesc;
            document.getElementById('modalBtn').textContent = t.modalBtn;

            try {
                const body = new URLSearchParams();
                for (const key in payload) { body.append(key, payload[key]); }
                await fetch(SCRIPT_URL, { method: "POST", body: body, mode: "no-cors" });
                document.getElementById('customModal').style.display = 'block';
            } catch (err) {
                console.error(err);
                document.getElementById('customModal').style.display = 'block';
            }
        }

        function goBack() {
            const preScore = urlParams.get('preScore') || '0';
            const iqScore = urlParams.get('iqScore') || '0';
            const eqScore = urlParams.get('eqScore') || '0';
            window.location.href = `index.html?name=${encodeURIComponent(userName)}&uuid=${encodeURIComponent(uuid)}&preScore=${preScore}&iqScore=${iqScore}&eqScore=${eqScore}`;
        }

        function goHome() {
            window.location.href = "index.html";
        }
    </script>

    <!-- Modal -->
    <div id="customModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%;
           background: transparent; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);">
        <div class="bg-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;">
        </div>
        <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
                color: white; margin: 12% auto; padding: 3rem 2rem; border-radius: 20px; width: 85%; max-width: 450px;
                text-align: center; border: 1px solid rgba(255,255,255,0.2);
                box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: fadeIn 0.5s ease-in-out;">
            <div style="width: 72px; height: 72px; margin: 0 auto 1.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(39, 174, 96, 0.2); border: 2px solid rgba(39, 174, 96, 0.5); color: #2ecc71;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h2 id="modalTitle" style="color: #f1c40f; margin-top: 0; font-size: 2rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                ขอบคุณสำหรับคำตอบ!</h2>
            <p id="modalDesc" style="font-size: 1.2rem; opacity: 0.95; line-height: 1.6; margin-bottom: 2rem;">
                ขอให้คุณโชคดีในการสัมภาษณ์</p>
            <button id="modalBtn" onclick="goHome()" style="background: #27ae60; color: white; border: none;
                   padding: 15px 40px; border-radius: 12px; cursor: pointer; font-size: 1.2rem;
                   font-weight: bold; transition: 0.3s; width: 100%;
                   box-shadow: 0 5px 15px rgba(39,174,96,0.4);">ตกลง</button>
        </div>
    </div>
</body>

</html>
