                q: "18. ปัญหาเรื่องสัญญาณรบกวนทางแม่เหล็กไฟฟ้า (EMI/RFI Noise) จากตัว Inverter ไปรบกวนสัญญาณเซนเซอร์และระบบคอนโทรลอื่นๆ ในโรงงาน เป็นปัญหาที่พบบ่อยมาก ข้อใดคือแนวทางเชิงเทคนิคที่คุณต้องแน่ใจว่าทีมขายแนะนำให้ลูกค้าติดตั้งเพื่อป้องกันปัญหานี้?",
                qEn: "18. EMI/RFI noise from inverters commonly disturbs factory analog sensors and controls. Which technical preventive practice must your sales team enforce?",
                options: [

                optionsEn: [

                ans: 1

            {

                categoryEn: "Category 4: Team Management & Crisis Resolution",
                q: "19. เมื่อทีมขายต้องไปนำเสนอขายระบบ Automation ให้กับโรงงานอุตสาหกรรมในเครือญี่ปุ่น (Japanese Accounts) สิ่งใดต่อไปนี้เป็นวัฒนธรรมองค์กรและเกณฑ์การตัดสินใจที่ฝั่งผู้ช่วยผู้จัดการขายต้องเตรียมตัวเป็นพิเศษ?",
                qEn: "19. When pitching automation projects to Japanese multinational industrial accounts, which cultural and decision-making dynamic demands thorough preparation?",
                options: [

                    "ข. การเตรียมเอกสารทางเทคนิคที่ละเอียดและครบถ้วนสูง (Ringi System), การเน้นความสัมพันธ์ระยะยาว (Trust), มาตรฐานคุณภาพสากลและการทดลองใช้เพื่อพิสูจน์ผล (PoC)",
                    "ค. การเน้นสินค้าที่มีราคาถูกที่สุดโดยไม่สนใจแบรนด์หรือสัญชาติสินค้า",
                    "ง. การชอบเอกสารนำเสนอที่มีเฉพาะรูปภาพและไม่มีเนื้อหาเชิงตัวเลข"
                ],
                optionsEn: [
                    "A. Instant unilateral purchasing authorizations granted solely by top executives.",
                    "B. Meticulously detailed technical documentation supporting consensus decision-making (Ringi system), proven long-term trust, and rigorous proof-of-concept (PoC) trials.",
                    "C. Exclusive focus on the cheapest price tag without regard for supplier pedigree.",
                    "D. Strong preference for picture-only slides stripped of quantified technical metrics."
                ],
                ans: 1
            },
            {
                category: "หมวดที่ 4: การบริหารทีมงาน การปิดดีล และการจัดการวิกฤตหน้างาน",
                categoryEn: "Category 4: Team Management & Crisis Resolution",
                q: "20. เอกสารทางเทคนิคประเภทใดต่อไปนี้ ที่ทีมขายของคุณต้องส่งให้โรงงานของลูกค้าตรวจสอบและอนุมัติก่อนเริ่มการสั่งซื้ออุปกรณ์เพื่อประกอบตู้คอนโทรล (Control Panel Assembly) เพื่อป้องกันข้อผิดพลาดในการติดตั้งจริง?",
                qEn: "20. Which technical deliverables must your sales engineering team submit for customer sign-off prior to purchasing and control panel assembly to avoid site discrepancies?",
                options: [
                    "ก. คู่มือการใช้งานหน้าจอ HMI ภาษาอังกฤษ",
                    "ข. แบบวงจรไฟฟ้า (Electrical Schematic Diagram / Control Circuit Diagram) และตารางรายการอุปกรณ์ (Bill of Materials - BOM)",
                    "ค. ใบรับรองการผ่านการอบรมของพนักงานขาย",
                    "ง. เอกสารงบการเงินย้อนหลัง 3 ปีของบริษัทเรา"
                ],
                optionsEn: [
                    "A. English-language user manual for the HMI terminal.",
                    "B. Detailed Electrical Schematic / Control Circuit Diagrams and comprehensive Bill of Materials (BOM) with part specifications.",
                    "C. Salesmanship training attendance certificate.",
                    "D. 3-year historical financial audited statements of our firm."
                ],
                ans: 1
            }
        ];

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyEfYLPui1hVutBVgvKXUV2pUSI5th8A8IAO75QRc_ZK1ia1lgoqNkbDZFwNhyncBj/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('name') || 'ผู้สมัคร';
        const userPos = urlParams.get('position') || 'Asst_Sales_Manager_Automation';
        const uuid = urlParams.get('uuid') || 'no-uuid';

        let currentStep = 0;
        const userAnswers = [];

        function applyLang(lang) {
            currentLang = lang;
            const t = ui[lang];
            const _lBtn = document.getElementById('langToggle');
            if (_lBtn) {
                _lBtn.innerHTML = `
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <span>${t.langBtn}</span>
                `;
            }
            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('userInfo').textContent = t.userInfo(userName, "ผู้ช่วยผู้จัดการฝ่ายขาย (Automation & Inverter)");
            renderQuestion();
        }

        document.getElementById('langToggle').addEventListener('click', () => {
            applyLang(currentLang === 'th' ? 'en' : 'th');
        });

        window.onload = () => {
            document.getElementById('userInfo').textContent = ui[currentLang].userInfo(userName, "ผู้ช่วยผู้จัดการฝ่ายขาย (Automation & Inverter)");
            renderQuestion();
        };

        function renderQuestion() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = "";
            const item = questions[currentStep];
            const t = ui[currentLang];

            const catText = (currentLang === 'en' && item.categoryEn) ? item.categoryEn : item.category;
            const questionText = (currentLang === 'en' && item.qEn) ? item.qEn : item.q;
            const opts = (currentLang === 'en' && item.optionsEn) ? item.optionsEn : item.options;

            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <span class="category-badge">${catText}</span>
                    <span class="progress-text" style="margin-bottom:0;">${t.progress(currentStep + 1, questions.length)}</span>
                </div>
                <p class="q-text">${questionText}</p>
                <div class="options-grid">
                    ${opts.map((opt, i) => `
                        <button type="button" class="opt-btn" onclick="selectOption(${i})">${opt}</button>
                    `).join('')}
                </div>`;
            container.appendChild(card);
        }

        async function selectOption(choiceIndex) {
            const item = questions[currentStep];
            userAnswers.push({
                text: item.options[choiceIndex],
                isCorrect: choiceIndex === item.ans
            });

            currentStep++;
            if (currentStep < questions.length) {
                renderQuestion();
            } else {
                await finishExam();
            }
        }

        async function finishExam() {
            const t = ui[currentLang];
            const container = document.getElementById('questionsContainer');
            container.innerHTML = `
                <div class="q-card" style="text-align:center; padding: 4rem 2rem;">
                    <div style="border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid #f1c40f; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 25px;"></div>
                    <h2 style="color:#f1c40f;">${t.saving}</h2>
                    <p style="opacity:0.8;">${t.savingDesc}</p>
                </div>
                <style>@keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }</style>`;

            let score = 0;
            const payload = {
                targetTab: "Asst_Sales_Manager_Automation",
                uuid: uuid,
                name: userName,
                position: "ผู้ช่วยผู้จัดการฝ่ายขาย (Automation & Inverter)",
                answersCount: questions.length,
                userAgent: navigator.userAgent
            };

            userAnswers.forEach((ans, i) => {
                if (ans.isCorrect) score++;
                payload[`q${i + 1}_title`] = questions[i].q;
                payload[`q${i + 1}_category`] = questions[i].category;
                payload[`q${i + 1}_text`] = ans.text;
                payload[`q${i + 1}_score`] = ans.isCorrect ? "1" : "0";
            });

            payload.totalScore = String(score);
            payload.hrStatus = score >= 16 ? "ผ่านเกณฑ์โดดเด่น (เรียกสัมภาษณ์)" : (score >= 12 ? "ผ่านเกณฑ์มาตรฐาน (พิจารณาเพิ่มเติม)" : "ไม่ผ่านเกณฑ์");
            payload.decisionNote = score >= 16 ? "แนะนำเรียกสัมภาษณ์ มีความเชี่ยวชาญทั้งเชิงกลยุทธ์และเทคนิค" : (score >= 12 ? "สัมภาษณ์เจาะลึกด้านเทคนิคและเคสหน้างานเพิ่มเติม" : "ไม่แนะนำ");

            document.getElementById('modalTitle').textContent = t.modalTitle;
            document.getElementById('modalDesc').textContent = t.modalDesc;
            document.getElementById('modalBtn').textContent = t.modalBtn;

            try {
                const body = new URLSearchParams();
                for (const key in payload) { body.append(key, payload[key]); }
                await fetch(SCRIPT_URL, { method: "POST", body: body, mode: "no-cors" });
                document.getElementById('customModal').style.display = 'block';
            } catch (err) {
                console.error(err);
                document.getElementById('customModal').style.display = 'block';
            }
        }

        function goBack() {
            const preScore = urlParams.get('preScore') || '0';
            const iqScore = urlParams.get('iqScore') || '0';
            const eqScore = urlParams.get('eqScore') || '0';
            window.location.href = `index.html?name=${encodeURIComponent(userName)}&uuid=${encodeURIComponent(uuid)}&preScore=${preScore}&iqScore=${iqScore}&eqScore=${eqScore}`;
        }

        function goHome() {
            window.location.href = "index.html";
        }
    </script>

    <!-- Modal -->
    <div id="customModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%;
           background: transparent; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);">
        <div class="bg-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;">
        </div>
        <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
                color: white; margin: 12% auto; padding: 3rem 2rem; border-radius: 20px; width: 85%; max-width: 450px;
                text-align: center; border: 1px solid rgba(255,255,255,0.2);
                box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: fadeIn 0.5s ease-in-out;">
            <div style="width: 72px; height: 72px; margin: 0 auto 1.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(39, 174, 96, 0.2); border: 2px solid rgba(39, 174, 96, 0.5); color: #2ecc71;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h2 id="modalTitle" style="color: #f1c40f; margin-top: 0; font-size: 2rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                ขอบคุณสำหรับคำตอบ!</h2>
            <p id="modalDesc" style="font-size: 1.2rem; opacity: 0.95; line-height: 1.6; margin-bottom: 2rem;">
                ขอให้คุณโชคดีในการสัมภาษณ์</p>
            <button id="modalBtn" onclick="goHome()" style="background: #27ae60; color: white; border: none;
                   padding: 15px 40px; border-radius: 12px; cursor: pointer; font-size: 1.2rem;
                   font-weight: bold; transition: 0.3s; width: 100%;
                   box-shadow: 0 5px 15px rgba(39,174,96,0.4);">ตกลง</button>
        </div>
    </div>
</body>
