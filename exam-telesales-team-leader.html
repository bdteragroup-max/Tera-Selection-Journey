                categoryEn: "Category 1: Sales Target & KPI Management",
                q: "1. ในช่วงครึ่งเดือนแรก ทีม Telesales ของคุณทำยอดขายได้เพียง 35% ของเป้าหมายรายเดือน (Target) เนื่องจากสภาวะตลาดซบเซาและคู่แข่งออกโปรโมชันตัดราคา ในฐานะหัวหน้าทีม แอ็กชันแรกที่คุณควรทำเพื่อพลิกสถานการณ์ (Turnaround Strategy) คืออะไร?",

                    "D. Let the team proceed as usual assuming second-half sales will organically recover."
                ],
                ans: 1

            {

                categoryEn: "Category 1: Sales Target & KPI Management",
                q: "2. คุณสังเกตเห็นว่าพนักงาน Telesales คนหนึ่งในทีมมีปริมาณการโทร (Call Volume) สูงที่สุดในทีม (มากกว่า 150 สายต่อวัน) แต่ยอดขายสะสม (Sales Volume) กลับอยู่ในระดับรั้งท้ายของทีม คุณคิดว่าปัญหาเกิดจากอะไรและจะแก้ไขอย่างไร?",

                    "ข. พนักงานอาจเน้นการวางสายไวหรือรีบจบบทสนทนาโดยไม่พยายามค้นหาความต้องการของลูกค้า (Lack of Engagement) ควรเข้าฟังไฟล์เสียง (Call Listening) เพื่อวิเคราะห์ทักษะการโน้มน้าวใจและปรับสคริปต์การปิดการขายรายบุคคล",

                    "ง. พนักงานไม่มีโชคในการขาย ควรทำเรื่องย้ายไปอยู่แผนกธุรการแทน"
                ],

                    "A. The rep is too diligent; order them to halve their daily call volume.",

                categoryEn: "Category 1: Sales Target & KPI Management",
                q: "3. เกณฑ์ชี้วัด (KPIs) ตัวใดที่หัวหน้าทีม Telesales ควรให้ความสำคัญมากที่สุดในการประเมินประสิทธิภาพ \"คุณภาพการเจรจาและการบริหารเวลา\" ของพนักงานขายในทีม?",

                    "ง. ความเร็วในการพิมพ์ดีดของพนักงานขณะบันทึกข้อมูลลูกค้า"
                ],
                optionsEn: [
                    "A. Average Talk Time combined with Conversion Rate.",
                    "B. Total number of inbound calls received alone.",
                    "C. Annual count of sick and personal leave instances.",
                    "D. Typing speed while logging customer CRM notes."
                ],
                ans: 0

            {
                category: "หมวดที่ 1: การบริหารยอดขายและการวิเคราะห์ประสิทธิภาพ",
                categoryEn: "Category 1: Sales Target & KPI Management",
                q: "4. ในช่วงสิ้นไตรมาส ผู้บริหารต้องการให้ทีม Telesales ขยายยอดขายจากฐานลูกค้าเก่าที่ขาดการติดต่อ (Inactive Customers) คุณจะวางกลยุทธ์การแบ่งกลุ่มลูกค้า (Data Segmentation) ให้ทีมอย่างไรเพื่อให้ได้ผลลัพธ์สูงสุด?",

                options: [
                    "ก. แจกรายชื่อทั้งหมดให้พนักงานทุกคนเท่าๆ กันโดยใช้วิธีสุ่มเพื่อความยุติธรรม",
                    "ข. คัดแยกข้อมูลลูกค้าเก่าตามพฤติกรรมการซื้อในอดีต (เช่น ยอดซื้อสูงสุด, ประเภทสินค้าที่เคยชอบ) และส่งต่อลีดเกรด A ให้กับพนักงานระดับ Top-Performer เพื่อเปิดการขายใหม่ ส่วนลีดทั่วไปใช้พนักงานใหม่ในการ Re-connect",
                    "ค. ให้พนักงานเลือกรายชื่อลูกค้าเก่าที่ตนเองชอบจากระบบตามความสมัครใจ",
                    "ง. นำรายชื่อทั้งหมดไปยิงโฆษณา SMS ซ้ำๆ โดยไม่จำเป็นต้องให้คนโทรหา"

                optionsEn: [
                    "A. Distribute lists uniformly and randomly to all reps for equal distribution.",
                    "B. Segment accounts by past purchasing behavior (high historical value, preferred product lines) and route Grade-A leads to top performers for re-activation while assigning regular leads to newer reps.",
                    "C. Let reps volunteer to pick whichever past client names they like.",
                    "D. Blast repeated promotional SMS messages to all numbers without dialing."
                ],
                ans: 1

            {
                category: "หมวดที่ 1: การบริหารยอดขายและการวิเคราะห์ประสิทธิภาพ",
                categoryEn: "Category 1: Sales Target & KPI Management",
                q: "5. หากบริษัทมีการปรับโครงสร้างค่าคอมมิชชัน (Commission Structure) ใหม่ ซึ่งส่งผลให้พนักงานทำยอดขายได้ยากขึ้นกว่าเดิม จนทำให้คนในทีมเริ่มหมดไฟและยอดขายสัปดาห์แรกตกลงอย่างเห็นได้ชัด คุณจะรับมือกับสถานการณ์นี้อย่างไร?",
                qEn: "5. The company introduced a revised commission structure making targets harder, leading to demoralization and a sharp first-week sales dip. How do you handle this?",
                options: [

                    "ค. แอบแก้ระบบหลังบ้านเพื่อโกงยอดขายช่วยพนักงานให้ได้ค่าคอมมิชชันเท่าเดิม",

                optionsEn: [
                    "A. Post a LINE group message demanding anyone dissatisfied with the terms submit their resignation.",
                    "B. Hold a transparent meeting explaining strategic business objectives, uncover new upside opportunities (such as premium-tier bonus accelerators), and run short-term internal sprint incentives.",

                    "D. Organize a team walkout strike to pressure leadership into reverting the policy."

            {

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyEfYLPui1hVutBVgvKXUV2pUSI5th8A8IAO75QRc_ZK1ia1lgoqNkbDZFwNhyncBj/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('name') || 'ผู้สมัคร';
        const userPos = urlParams.get('position') || 'Telesales_Team_Leader';
        const uuid = urlParams.get('uuid') || 'no-uuid';

        let currentStep = 0;
        const userAnswers = [];

        function applyLang(lang) {
            currentLang = lang;
            const t = ui[lang];
            const _lBtn = document.getElementById('langToggle');
            if (_lBtn) {
                _lBtn.innerHTML = `
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <span>${t.langBtn}</span>
                `;
            }
            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('userInfo').textContent = t.userInfo(userName, "หัวหน้าทีม Telesales");
            renderQuestion();
        }

        document.getElementById('langToggle').addEventListener('click', () => {
            applyLang(currentLang === 'th' ? 'en' : 'th');
        });

        window.onload = () => {
            document.getElementById('userInfo').textContent = ui[currentLang].userInfo(userName, "หัวหน้าทีม Telesales");
            renderQuestion();
        };

        function renderQuestion() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = "";
            const item = questions[currentStep];
            const t = ui[currentLang];

            const catText = (currentLang === 'en' && item.categoryEn) ? item.categoryEn : item.category;
            const questionText = (currentLang === 'en' && item.qEn) ? item.qEn : item.q;
            const opts = (currentLang === 'en' && item.optionsEn) ? item.optionsEn : item.options;

            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <span class="category-badge">${catText}</span>
                    <span class="progress-text" style="margin-bottom:0;">${t.progress(currentStep + 1, questions.length)}</span>
                </div>
                <p class="q-text">${questionText}</p>
                <div class="options-grid">
                    ${opts.map((opt, i) => `
                        <button type="button" class="opt-btn" onclick="selectOption(${i})">${opt}</button>
                    `).join('')}
                </div>`;
            container.appendChild(card);
        }

        async function selectOption(choiceIndex) {
            const item = questions[currentStep];
            userAnswers.push({
                text: item.options[choiceIndex],
                isCorrect: choiceIndex === item.ans
            });

            currentStep++;
            if (currentStep < questions.length) {
                renderQuestion();
            } else {
                await finishExam();
            }
        }

        async function finishExam() {
            const t = ui[currentLang];
            const container = document.getElementById('questionsContainer');
            container.innerHTML = `
                <div class="q-card" style="text-align:center; padding: 4rem 2rem;">
                    <div style="border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid #f1c40f; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 25px;"></div>
                    <h2 style="color:#f1c40f;">${t.saving}</h2>
                    <p style="opacity:0.8;">${t.savingDesc}</p>
                </div>
                <style>@keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }</style>`;

            let score = 0;
            const payload = {
                targetTab: "Telesales_Team_Leader",
                uuid: uuid,
                name: userName,
                position: "หัวหน้าทีม Telesales",
                answersCount: questions.length,
                userAgent: navigator.userAgent
            };

            userAnswers.forEach((ans, i) => {
                if (ans.isCorrect) score++;
                payload[`q${i + 1}_title`] = questions[i].q;
                payload[`q${i + 1}_category`] = questions[i].category;
                payload[`q${i + 1}_text`] = ans.text;
                payload[`q${i + 1}_score`] = ans.isCorrect ? "1" : "0";
            });

            payload.totalScore = String(score);
            payload.hrStatus = score >= 16 ? "ผ่านเกณฑ์โดดเด่น (เรียกสัมภาษณ์)" : (score >= 12 ? "ผ่านเกณฑ์มาตรฐาน (พิจารณาเพิ่มเติม)" : "ไม่ผ่านเกณฑ์");
            payload.decisionNote = score >= 16 ? "เรียกสัมภาษณ์ มีทักษะความเป็นผู้นำ โค้ชชิ่ง วิเคราะห์ข้อมูล KPI และแก้ปัญหายอดขายได้ยอดเยี่ยม" : (score >= 12 ? "พิจารณาประวัติการบริหารทีมและการสัมภาษณ์เพิ่มเติม" : "ไม่แนะนำ");

            document.getElementById('modalTitle').textContent = t.modalTitle;
            document.getElementById('modalDesc').textContent = t.modalDesc;
            document.getElementById('modalBtn').textContent = t.modalBtn;

            try {
                const body = new URLSearchParams();
                for (const key in payload) { body.append(key, payload[key]); }
                await fetch(SCRIPT_URL, { method: "POST", body: body, mode: "no-cors" });
                document.getElementById('customModal').style.display = 'block';
            } catch (err) {
                console.error(err);
                document.getElementById('customModal').style.display = 'block';
            }
        }

        function goBack() {
            const preScore = urlParams.get('preScore') || '0';
            const iqScore = urlParams.get('iqScore') || '0';
            const eqScore = urlParams.get('eqScore') || '0';
            window.location.href = `index.html?name=${encodeURIComponent(userName)}&uuid=${encodeURIComponent(uuid)}&preScore=${preScore}&iqScore=${iqScore}&eqScore=${eqScore}`;
        }

        function goHome() {
            window.location.href = "index.html";
        }
    </script>

    <!-- Modal -->
    <div id="customModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%;
           background: transparent; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);">
        <div class="bg-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;">
        </div>
        <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
                color: white; margin: 12% auto; padding: 3rem 2rem; border-radius: 20px; width: 85%; max-width: 450px;
                text-align: center; border: 1px solid rgba(255,255,255,0.2);
                box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: fadeIn 0.5s ease-in-out;">
            <div style="width: 72px; height: 72px; margin: 0 auto 1.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(39, 174, 96, 0.2); border: 2px solid rgba(39, 174, 96, 0.5); color: #2ecc71;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h2 id="modalTitle" style="color: #f1c40f; margin-top: 0; font-size: 2rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                ขอบคุณสำหรับคำตอบ!</h2>
            <p id="modalDesc" style="font-size: 1.2rem; opacity: 0.95; line-height: 1.6; margin-bottom: 2rem;">
                ขอให้คุณโชคดีในการสัมภาษณ์</p>
            <button id="modalBtn" onclick="goHome()" style="background: #27ae60; color: white; border: none;
                   padding: 15px 40px; border-radius: 12px; cursor: pointer; font-size: 1.2rem;
                   font-weight: bold; transition: 0.3s; width: 100%;
                   box-shadow: 0 5px 15px rgba(39,174,96,0.4);">ตกลง</button>
        </div>
    </div>
</body>
