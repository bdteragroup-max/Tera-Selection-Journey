    <style>
        .exam-container {
            max-width: 850px;

        }

        .q-card {
            background: rgba(255, 255, 255, 0.1);

            padding: 2.2rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            animation: fadeIn 0.4s ease-out;
        }

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .q-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            color: #f1c40f;
        }

        .options-grid {
            display: grid;
            gap: 0.8rem;
        }

        .opt-btn {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            padding: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            text-align: left;
            font-size: 1.05rem;
            width: 100%;
        }

        .opt-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #f1c40f;
        }

        .progress-text {
            color: #fff;
            opacity: 0.6;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: right;
        }

        #langToggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9000;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            padding: 7px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }

        #langToggle:hover {
            background: rgba(255, 255, 255, 0.28);
        }
    
        #backBtn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 9000;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.35);

            font-size: 0.9rem;
            font-weight: 600;

            background: rgba(255, 255, 255, 0.28);

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyEfYLPui1hVutBVgvKXUV2pUSI5th8A8IAO75QRc_ZK1ia1lgoqNkbDZFwNhyncBj/exec";

        const userName = urlParams.get('name') || 'ผู้สมัคร';
        const userPos = urlParams.get('position') || 'Safety Officer';
        const uuid = urlParams.get('uuid') || 'no-uuid';

        let currentStep = 0;
        const userAnswers = [];

        function applyLang(lang) {
            currentLang = lang;
            const t = ui[lang];
            document.getElementById('langToggle').textContent = t.langBtn;
            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('userInfo').textContent = t.userInfo(userName, userPos);
            renderQuestion();
        }

        document.getElementById('langToggle').addEventListener('click', () => {
            applyLang(currentLang === 'th' ? 'en' : 'th');
        });

        window.onload = () => {
            document.getElementById('userInfo').textContent = ui[currentLang].userInfo(userName, userPos);
            renderQuestion();
        };

        function renderQuestion() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = "";
            const item = questions[currentStep];
            const t = ui[currentLang];

            const questionText = (currentLang === 'en' && item.qEn) ? item.qEn : item.q;
            const opts = (currentLang === 'en' && item.optionsEn) ? item.optionsEn : item.options;

            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="progress-text">${t.progress(currentStep + 1, questions.length)}</div>
                <p class="q-text">${questionText}</p>
                <div class="options-grid">
                    ${opts.map((opt, i) => `
                        <button type="button" class="opt-btn" onclick="selectOption(${i})">${opt}</button>
                    `).join('')}
                </div>`;
            container.appendChild(card);
        }

        async function selectOption(choiceIndex) {
            const item = questions[currentStep];
            userAnswers.push({
                text: item.options[choiceIndex],
                isCorrect: choiceIndex === item.ans
            });

            if (currentStep < questions.length - 1) {
                currentStep++;
                renderQuestion();
            } else {
                await finishExam();
            }
        }

        async function finishExam() {
            const t = ui[currentLang];
            const container = document.getElementById('questionsContainer');
            container.innerHTML = `
                <div class="q-card" style="text-align:center; padding: 4rem 2rem;">
                    <div style="border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid #f1c40f; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 25px;"></div>
                    <h2 style="color:#f1c40f;">${t.saving}</h2>
                    <p style="opacity:0.8;">${t.savingDesc}</p>
                </div>
                <style>@keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }</style>`;

            let score = 0;
            const payload = {
                targetTab: userPos,
                uuid: uuid,
                name: userName,
                position: userPos,
                answersCount: questions.length,
                userAgent: navigator.userAgent
            };

            userAnswers.forEach((ans, i) => {
                if (ans.isCorrect) score++;
                payload[`q${i + 1}_title`] = questions[i].q;
                payload[`q${i + 1}_text`] = ans.text;
                payload[`q${i + 1}_score`] = ans.isCorrect ? "1" : "0";
            });

            payload.totalScore = String(score);
            payload.hrStatus = score >= 16 ? "ดีมาก" : (score >= 13 ? "ดี" : (score >= 10 ? "พอใช้" : "ต่ำกว่าเกณฑ์"));
            payload.decisionNote = score >= 16 ? "ดีมาก — มีพื้นฐานความรู้ด้านความปลอดภัยที่เหมาะสม" : (score >= 13 ? "ดี — มีความรู้พื้นฐานค่อนข้างดี ควรสัมภาษณ์เชิงสถานการณ์เพิ่มเติม" : (score >= 10 ? "พอใช้ — ควรประเมินประสบการณ์ภาคสนามและความเข้าใจข้อกำหนดเพิ่มเติม" : "ต่ำกว่าเกณฑ์ — ควรพิจารณาความรู้และประสบการณ์ด้านความปลอดภัยเพิ่มเติม"));

            document.getElementById('modalTitle').textContent = t.modalTitle;
            document.getElementById('modalDesc').textContent = t.modalDesc;
            document.getElementById('modalBtn').textContent = t.modalBtn;

            try {
                const body = new URLSearchParams();
                for (const key in payload) { body.append(key, payload[key]); }
                await fetch(SCRIPT_URL, { method: "POST", body: body, mode: "no-cors" });
                document.getElementById('customModal').style.display = 'block';
            } catch (err) {
                console.error(err);
                document.getElementById('customModal').style.display = 'block';
            }
        }

        function goBack() {
            const preScore = urlParams.get('preScore') || '0';
            window.location.href = `index.html?name=${encodeURIComponent(userName)}&uuid=${encodeURIComponent(uuid)}&preScore=${preScore}`;
        }

        function goHome() {
            window.location.href = "index.html";
        }
